name: 上游自动同步并编译

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨自动检查
  workflow_dispatch:       # 允许手动点击运行

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 同步上游代码
        uses: a260020290/pull-request-mirror-action@v1.1.0
        with:
          base: dev         # 你的分支
          head: dev         # 上游的分支
          owner: frknkrc44  # 原作者名
          repo: tdesktop-x64
